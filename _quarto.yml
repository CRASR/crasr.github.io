project:
  type: website

website:
  title: "CRASR · Center for Reservoir and Aquatic Systems Research"
  site-url: https://crasr.github.io
  description: "Data pipelines, databases, models, and software from the Center for Reservoir and Aquatic Systems Research (CRASR) at Baylor University."
  navbar:
    title: "CRASR"   # full name is appended on wide screens via styles.scss
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About
    right:
      - text: "CRASR website"
        icon: box-arrow-up-right
        href: https://crasr.artsandsciences.baylor.edu/
      - icon: github
        href: https://github.com/CRASR
        aria-label: CRASR on GitHub
  page-footer:
    left: "[Center for Reservoir and Aquatic Systems Research (CRASR)](https://crasr.artsandsciences.baylor.edu/) · Baylor University"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false

# If you add R/Python code chunks later, run `quarto render` locally and
# commit the _freeze/ folder so the GitHub Action doesn't need R installed.
execute:
  freeze: auto
